# Rules engine config -- the "YAML rules engine" half of the hybrid decision
# layer (see backend/app/rules_engine.py for the evaluator, and
# backend/app/hybrid_scoring.py for how this blends with the XGBoost model).
# Each rule's conditions are ANDed together; a rule "hits" when all of its
# conditions are true against the engineered feature dict.
#
# op values: gte, gt, lte, lt, eq, in
version: "rules-1.0.0"
rules:
  - id: AMOUNT_ABOVE_5X_BASELINE
    reason: AMOUNT_SIGNIFICANTLY_ABOVE_CUSTOMER_AVERAGE
    severity: HIGH
    weight: 0.30
    conditions:
      - { feature: amount_to_customer_average, op: gte, value: 5 }

  - id: AMOUNT_ABOVE_2X_BASELINE
    reason: AMOUNT_ABOVE_CUSTOMER_AVERAGE
    severity: MEDIUM
    weight: 0.12
    conditions:
      - { feature: amount_to_customer_average, op: gte, value: 2 }
      - { feature: amount_to_customer_average, op: lt, value: 5 }

  - id: NEW_DEVICE
    reason: DEVICE_FIRST_SEEN_RECENTLY
    severity: MEDIUM
    weight: 0.15
    conditions:
      - { feature: is_new_device, op: eq, value: 1 }

  - id: NEW_BENEFICIARY
    reason: NEW_PAYEE_ADDED
    severity: MEDIUM
    weight: 0.10
    conditions:
      - { feature: is_new_beneficiary, op: eq, value: 1 }

  - id: CROSS_BORDER_TRANSACTION
    reason: CROSS_BORDER_TRANSACTION_DETECTED
    severity: LOW
    weight: 0.08
    conditions:
      - { feature: cross_border_transaction, op: eq, value: 1 }

  - id: IP_COUNTRY_MISMATCH
    reason: IP_LOCATION_MISMATCH
    severity: MEDIUM
    weight: 0.12
    conditions:
      - { feature: ip_country_mismatch, op: eq, value: 1 }

  - id: TRANSACTION_COUNTRY_MISMATCH
    reason: TRANSACTION_LOCATION_MISMATCH
    severity: MEDIUM
    weight: 0.10
    conditions:
      - { feature: transaction_country_mismatch, op: eq, value: 1 }

  - id: HIGH_RISK_MERCHANT
    reason: MERCHANT_CATEGORY_ELEVATED_RISK
    severity: MEDIUM
    weight: 0.15
    conditions:
      - { feature: merchant_high_risk, op: eq, value: 1 }

  - id: HIGH_RISK_CUSTOMER
    reason: CUSTOMER_RISK_PROFILE_ELEVATED
    severity: MEDIUM
    weight: 0.12
    conditions:
      - { feature: customer_high_risk, op: eq, value: 1 }

  - id: VELOCITY_ABUSE
    reason: HIGH_TRANSACTION_VELOCITY
    severity: HIGH
    weight: 0.20
    conditions:
      - { feature: transactions_last_10_minutes, op: gte, value: 4 }

  - id: AUTH_FAILURES_DETECTED
    reason: RECENT_AUTH_FAILURES
    severity: MEDIUM
    weight: 0.10
    conditions:
      - { feature: failed_attempts_last_24_hours, op: gte, value: 3 }

  - id: DORMANT_ACCOUNT_REACTIVATION
    reason: DORMANT_ACCOUNT_REACTIVATED
    severity: MEDIUM
    weight: 0.12
    conditions:
      - { feature: days_since_last_transaction, op: gte, value: 180 }
      - { feature: amount_to_customer_average, op: gte, value: 2 }

  - id: NEW_ACCOUNT_HIGH_VALUE
    reason: NEW_ACCOUNT_HIGH_VALUE_TXN
    severity: HIGH
    weight: 0.18
    conditions:
      - { feature: account_age_days, op: lt, value: 30 }
      - { feature: amount_to_customer_average, op: gte, value: 3 }

  - id: NEW_DEVICE_SHORT_SESSION
    reason: ABBREVIATED_SESSION_NEW_DEVICE
    severity: LOW
    weight: 0.06
    conditions:
      - { feature: is_new_device, op: eq, value: 1 }
      - { feature: session_duration_seconds, op: lt, value: 10 }
